services:
  api:
    environment:
      ENVIRONMENT: demo
      DEMO_MODE: "true"
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_PROVIDER: sentence_transformers
      CROSS_ENCODER_ENABLED: "true"
    depends_on:
      ollama:
        condition: service_healthy
  worker:
    environment:
      ENVIRONMENT: demo
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_PROVIDER: sentence_transformers
      CROSS_ENCODER_ENABLED: "true"
    depends_on:
      ollama:
        condition: service_healthy
