[project]
name = "aftersales-agent"
version = "0.1.0"
description = "星云智家售后服务智能体：版本感知 RAG、可治理记忆和工具闭环"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "rank-bm25>=0.2.2,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "structlog>=24,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
local-embedding = ["sentence-transformers>=3,<6"]
observability = ["langfuse>=4.7,<6"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".codex-tools", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "B008", # FastAPI dependency declarations intentionally call Depends/File/Form.
  "E501", # Formatting is enforced by Ruff; long Chinese strings stay readable.
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

